<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingDomsOfGeorgia // Official Forum</title>
    <style>
        :root {
            --bg-color: #05040a;
            --panel-bg: rgba(15, 10, 22, 0.85);
            --border-color: rgba(255, 26, 64, 0.3);
            --primary-glow: #ff1a40;
            --primary-gradient: linear-gradient(135deg, #ff1a40, #800014);
            --owner-gold: #ffd700;
            --admin-blue: #00d2ff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 26, 64, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(128, 0, 20, 0.25) 0%, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 26, 64, 0.2);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--primary-glow);
        }
        .logo span { color: var(--primary-glow); }

        .user-panel { display: flex; align-items: center; gap: 15px; }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 26, 64, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 26, 64, 0.8);
        }

        .btn-admin {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .btn-admin:hover { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }

        .forum-grid { display: grid; grid-template-columns: 280px 1fr 280px; gap: 20px; }

        @media (max-width: 1024px) {
            .forum-grid { grid-template-columns: 1fr; }
        }

        .sidebar-menu, .main-content, .widget {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .menu-title, .section-title, .widget h4 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #fff;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .category-item {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .category-item:hover, .category-item.active {
            background: rgba(255, 26, 64, 0.15);
            color: #fff;
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(255, 26, 64, 0.3);
            transform: translateX(4px);
        }

        .thread-card {
            background: rgba(20, 15, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .thread-card:hover {
            border-color: var(--primary-glow);
            box-shadow: 0 0 20px rgba(255, 26, 64, 0.4);
            transform: translateY(-3px);
        }

        .role-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-left: 6px;
        }
        .role-owner { background: #ffd700; color: #000; box-shadow: 0 0 8px #ffd700; }
        .role-admin { background: #00d2ff; color: #000; box-shadow: 0 0 8px #00d2ff; }
        .role-member { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .owner-actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-approve { background: #00c853; border: none; padding: 6px 14px; border-radius: 6px; color: white; cursor: pointer; font-weight: 700; }
        .btn-reject { background: #d50000; border: none; padding: 6px 14px; border-radius: 6px; color: white; cursor: pointer; font-weight: 700; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #0f0a14; border: 1px solid var(--primary-glow);
            padding: 30px; border-radius: 16px; width: 100%; max-width: 520px;
            box-shadow: 0 0 40px rgba(255, 26, 64, 0.5);
        }

        .admin-user-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .role-select { background: #1a1525; color: white; border: 1px solid var(--primary-glow); padding: 5px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">KINGDOMS OF <span>GEORGIA</span></div>
            <div class="user-panel" id="userHeaderPanel">
                <!-- Dynamic Header via JS -->
            </div>
        </header>

        <div class="forum-grid">
            <!-- Navigation -->
            <div class="sidebar-menu">
                <div class="menu-title">📌 კატეგორიები</div>
                <div class="category-item active" onclick="selectCategory('all', this)">🌐 ყველა თემა</div>
                <div class="category-item" onclick="selectCategory('chat', this)">💬 ზოგადი ჩათი</div>
                <div class="category-item" onclick="selectCategory('reports', this)">⚔️ საჩივრები</div>
                <div class="category-item" onclick="selectCategory('approved', this)">✅ დადასტურებული</div>
                <div class="category-item" onclick="selectCategory('rejected', this)">❌ უარყოფილი</div>
                <div class="category-item" onclick="selectCategory('sell', this)">🛒 გაყიდვა</div>
                <div class="category-item" onclick="selectCategory('buy', this)">💰 ყიდვა</div>
            </div>

            <!-- Content Area -->
            <div class="main-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div class="section-title" id="currentCategoryTitle" style="border: none; margin: 0;">🌐 ყველა თემა</div>
                    <button class="btn" onclick="openNewThreadModal()">+ ახალი თემა</button>
                </div>
                <div id="threadContainer"></div>
            </div>

            <!-- Profile Sidebar -->
            <div class="sidebar-right">
                <div class="widget">
                    <h4>👑 ჩემი პროფილი</h4>
                    <div id="profileWidgetContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3 style="color: #ffd700; margin-bottom: 15px;">👑 ადმინ პანელი — როლების მართვა</h3>
            <div id="userListContainer"></div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn" onclick="closeAdminModal()">დახურვა</button>
            </div>
        </div>
    </div>

    <!-- New Thread Modal -->
    <div class="modal" id="threadModal">
        <div class="modal-content">
            <h3 style="color: #fff; margin-bottom: 15px;">შექმენი ახალი თემა</h3>
            <div style="margin-bottom: 12px;">
                <label style="color: #94a3b8; font-size: 13px;">აირჩიე კატეგორია:</label>
                <select id="newThreadCategory" style="width: 100%; padding: 10px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; margin-top: 5px;">
                    <option value="chat">💬 ზოგადი ჩათი</option>
                    <option value="reports">⚔️ საჩივრები</option>
                    <option value="sell">🛒 გაყიდვა</option>
                    <option value="buy">💰 ყიდვა</option>
                </select>
            </div>
            <div style="margin-bottom: 12px;">
                <input type="text" id="newThreadTitle" placeholder="თემის სათაური..." style="width: 100%; padding: 12px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <textarea id="newThreadContent" rows="5" placeholder="დაწერე ტექსტი..." style="width: 100%; padding: 12px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 8px;"></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn" style="background: transparent; border: 1px solid #fff;" onclick="closeNewThreadModal()">გაუქმება</button>
                <button class="btn" onclick="publishThread()">გამოქვეყნება</button>
            </div>
        </div>
    </div>

    <script>
        // Default Logged In User set to Suspecttt with OWNER Role
        let currentUser = { username: "Suspecttt", role: "Owner" };

        let users = [
            { username: "Suspecttt", role: "Owner" },
            { username: "KingAdmin", role: "Admin" },
            { username: "Player_1", role: "Member" }
        ];

        let threads = [
            {
                id: 1,
                author: "Suspecttt",
                role: "Owner",
                category: "chat",
                title: "👑 KingDomsOfGeorgia-ს ოფიციალური ფორუმი გახსნილია!",
                content: "მოგესალმებით ყველას! სამეფოს მთავარი ჰაბი მზადაა. დაიცავით წესები და ისიამოვნეთ.",
                status: null
            },
            {
                id: 2,
                author: "Player_1",
                role: "Member",
                category: "reports",
                title: "⚔️ საჩივარი მოთამაშეზე TestUser",
                content: "1. ჩემი ნიკი: Player_1\n2. დამრღვევის ნიკი: TestUser\n3. მიზეზი: წესების დარღვევა",
                status: "pending"
            }
        ];

        let activeCategory = "all";

        function renderHeader() {
            const panel = document.getElementById('userHeaderPanel');
            let badgeClass = currentUser.role === "Owner" ? "role-owner" : "role-member";
            let adminBtn = (currentUser.role === "Owner" || currentUser.role === "Admin") 
                ? `<button class="btn btn-admin" onclick="openAdminModal()">👑 ადმინ პანელი</button>` : '';

            panel.innerHTML = `
                <span>👑 <b>${currentUser.username}</b> <span class="role-badge ${badgeClass}">${currentUser.role}</span></span>
                ${adminBtn}
            `;
        }

        function renderProfileWidget() {
            const widget = document.getElementById('profileWidgetContent');
            let badgeClass = currentUser.role === "Owner" ? "role-owner" : "role-member";
            widget.innerHTML = `
                <p style="margin-bottom: 8px;">სახელი: <b>${currentUser.username}</b></p>
                <p style="margin-bottom: 15px;">რანგი: <span class="role-badge ${badgeClass}">${currentUser.role}</span></p>
                ${currentUser.role === "Owner" ? '<p style="color: #ffd700; font-size: 13px;">✔ შენ გაქვს ფორუმის სრული მართვის უფლება!</p>' : ''}
            `;
        }

        function renderThreads() {
            const container = document.getElementById('threadContainer');
            container.innerHTML = '';

            let filtered = activeCategory === 'all' 
                ? threads 
                : threads.filter(t => t.category === activeCategory);

            if (filtered.length === 0) {
                container.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 40px;">ამ კატეგორიაში თემები ჯერ არ არის.</div>';
                return;
            }

            filtered.forEach(thread => {
                let badgeClass = thread.role === "Owner" ? "role-owner" : (thread.role === "Admin" ? "role-admin" : "role-member");
                
                let ownerButtons = '';
                if ((currentUser.role === "Owner" || currentUser.role === "Admin") && thread.category === "reports" && thread.status === "pending") {
                    ownerButtons = `
                        <div class="owner-actions">
                            <button class="btn-approve" onclick="reviewReport(${thread.id}, 'approved')">✅ დადასტურება</button>
                            <button class="btn-reject" onclick="reviewReport(${thread.id}, 'rejected')">❌ უარყოფა</button>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="thread-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h3 style="color: #fff;">${thread.title}</h3>
                            <span class="role-badge ${badgeClass}">${thread.role} // ${thread.author}</span>
                        </div>
                        <p style="color: #cbd5e1; font-size: 14px; white-space: pre-line;">${thread.content}</p>
                        ${ownerButtons}
                    </div>
                `;
            });
        }

        function selectCategory(cat, el) {
            activeCategory = cat;
            document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('currentCategoryTitle').innerText = el.innerText;
            renderThreads();
        }

        function reviewReport(threadId, decision) {
            let thread = threads.find(t => t.id === threadId);
            if (thread) {
                thread.category = decision;
                thread.status = decision;
                alert(decision === 'approved' ? '✅ საჩივარი დადასტურდა!' : '❌ საჩივარი უარყოფილია!');
                renderThreads();
            }
        }

        function openAdminModal() {
            const list = document.getElementById('userListContainer');
            list.innerHTML = '';
            users.forEach(u => {
                list.innerHTML += `
                    <div class="admin-user-row">
                        <span style="color: white; font-weight: 700;">${u.username}</span>
                        <select class="role-select" onchange="changeUserRole('${u.username}', this.value)">
                            <option value="Member" ${u.role === 'Member' ? 'selected' : ''}>Member</option>
                            <option value="Admin" ${u.role === 'Admin' ? 'selected' : ''}>Admin</option>
                            <option value="Owner" ${u.role === 'Owner' ? 'selected' : ''}>Owner</option>
                        </select>
                    </div>
                `;
            });
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

        function changeUserRole(username, newRole) {
            let user = users.find(u => u.username === username);
            if (user) {
                user.role = newRole;
                if (username === currentUser.username) {
                    currentUser.role = newRole;
                    renderHeader();
                    renderProfileWidget();
                }
                alert(`${username}-ის როლი შეიცვალა: ${newRole}`);
            }
        }

        function openNewThreadModal() { document.getElementById('threadModal').style.display = 'flex'; }
        function closeNewThreadModal() { document.getElementById('threadModal').style.display = 'none'; }

        function publishThread() {
            let title = document.getElementById('newThreadTitle').value;
            let content = document.getElementById('newThreadContent').value;
            let category = document.getElementById('newThreadCategory').value;

            if (!title || !content) return alert('გთხოვთ შეავსოთ ყველა ველი!');

            threads.unshift({
                id: Date.now(),
                author: currentUser.username,
                role: currentUser.role,
                category: category,
                title: title,
                content: content,
                status: category === 'reports' ? 'pending' : null
            });

            closeNewThreadModal();
            document.getElementById('newThreadTitle').value = '';
            document.getElementById('newThreadContent').value = '';
            renderThreads();
        }

        // Initialize App
        renderHeader();
        renderProfileWidget();
        renderThreads();
    </script>
</body>
</html>
