<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingDomsOfGeorgia // Official Forum</title>
    <style>
        :root {
            --bg-color: #05040a;
            --panel-bg: rgba(15, 10, 22, 0.85);
            --border-color: rgba(255, 26, 64, 0.3);
            --primary-glow: #ff1a40;
            --primary-gradient: linear-gradient(135deg, #ff1a40, #800014);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 26, 64, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(128, 0, 20, 0.25) 0%, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 26, 64, 0.2);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--primary-glow);
        }
        .logo span { color: var(--primary-glow); }

        .user-panel { display: flex; align-items: center; gap: 15px; }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 26, 64, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 26, 64, 0.8);
        }

        .btn-admin {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .btn-admin:hover { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }

        .forum-grid { display: grid; grid-template-columns: 280px 1fr 280px; gap: 20px; }

        @media (max-width: 1024px) {
            .forum-grid { grid-template-columns: 1fr; }
        }

        .sidebar-menu, .main-content, .widget {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .menu-title, .section-title, .widget h4 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #fff;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .category-item {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .category-item:hover, .category-item.active {
            background: rgba(255, 26, 64, 0.15);
            color: #fff;
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(255, 26, 64, 0.3);
            transform: translateX(4px);
        }

        .thread-card {
            background: rgba(20, 15, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .thread-card:hover {
            border-color: var(--primary-glow);
            box-shadow: 0 0 20px rgba(255, 26, 64, 0.4);
            transform: translateY(-3px);
        }

        .role-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-left: 6px;
        }
        .role-owner { background: #ffd700; color: #000; box-shadow: 0 0 8px #ffd700; }
        .role-admin { background: #00d2ff; color: #000; box-shadow: 0 0 8px #00d2ff; }
        .role-member { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .owner-actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-approve { background: #00c853; border: none; padding: 6px 14px; border-radius: 6px; color: white; cursor: pointer; font-weight: 700; }
        .btn-reject { background: #d50000; border: none; padding: 6px 14px; border-radius: 6px; color: white; cursor: pointer; font-weight: 700; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px);
            justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: #0f0a14; border: 1px solid var(--primary-glow);
            padding: 30px; border-radius: 16px; width: 100%; max-width: 450px;
            box-shadow: 0 0 40px rgba(255, 26, 64, 0.5);
        }

        .admin-user-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .role-select { background: #1a1525; color: white; border: 1px solid var(--primary-glow); padding: 5px; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- ავტორიზაციის ფანჯარა -->
    <div class="modal" id="authModal" style="display: flex;">
        <div class="modal-content">
            <h3 style="color: #fff; margin-bottom: 20px; text-align: center;">⚔️ KingDomsOfGeorgia // შესვლა</h3>
            <div style="margin-bottom: 15px;">
                <label style="color: var(--text-muted); font-size: 13px;">მომხმარებლის სახელი (Nickname):</label>
                <input type="text" id="authUsername" placeholder="შეიყვანე შენი ნიკი..." style="width: 100%; padding: 12px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; margin-top: 5px;">
            </div>
            <button class="btn" style="width: 100%; padding: 12px;" onclick="handleAuth()">შესვლა ფორუმზე</button>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="logo">KINGDOMS OF <span>GEORGIA</span></div>
            <div class="user-panel" id="userHeaderPanel"></div>
        </header>

        <div class="forum-grid">
            <!-- ნავიგაციის მენიუ -->
            <div class="sidebar-menu">
                <div class="menu-title">📌 კატეგორიები</div>
                <div class="category-item active" onclick="selectCategory('all', this)">🌐 ყველა თემა</div>
                <div class="category-item" onclick="selectCategory('chat', this)">💬 ზოგადი ჩათი</div>
                <div class="category-item" onclick="selectCategory('reports', this)">⚔️ საჩივრები</div>
                <div class="category-item" onclick="selectCategory('approved', this)">✅ დადასტურებული</div>
                <div class="category-item" onclick="selectCategory('rejected', this)">❌ უარყოფილი</div>
                <div class="category-item" onclick="selectCategory('sell', this)">🛒 გაყიდვა</div>
                <div class="category-item" onclick="selectCategory('buy', this)">💰 ყიდვა</div>
            </div>

            <!-- მთავარი შიგთავსი -->
            <div class="main-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div class="section-title" id="currentCategoryTitle" style="border: none; margin: 0;">🌐 ყველა თემა</div>
                    <button class="btn" id="newThreadBtn" onclick="openNewThreadModal()">+ ახალი თემა</button>
                </div>
                <div id="threadContainer"></div>
            </div>

            <!-- პროფილის ვიჯეტი -->
            <div class="sidebar-right">
                <div class="widget">
                    <h4>👑 ჩემი პროფილი</h4>
                    <div id="profileWidgetContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ადმინ პანელის ფანჯარა -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 550px;">
            <h3 style="color: #ffd700; margin-bottom: 15px;">👑 ადმინ პანელი — როლების მართვა</h3>
            <div id="
